[package]
name = "craxii-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = []
test-failpoints = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "json", "time"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"
