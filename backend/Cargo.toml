[package]
name = "craxii-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = []
test-failpoints = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tracing", "ws"] }
getrandom = { version = "0.4", default-features = false }
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
tokio = { version = "1.53", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tower = { version = "0.5.3", default-features = false, features = ["limit", "util"] }
tower-http = { version = "0.7.0", default-features = false, features = ["limit", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "json", "time"] }
url = "2.5"
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
